name: Publish Android AAB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: "10"

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          expo-version: latest
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build package
        run: |
          pnpm run build:android:production --non-interactive --output=./dist/app.aab

      - name: Publish to EAS
        run: |
          pnpm run submit:android:production --non-interactive --path ./dist/app.aab
